<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciclos — CRM de seguimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF6F0;
    --surface: #FFFFFF;
    --ink: #2A2230;
    --ink-soft: #8A7D8F;
    --primary: #493A5C;
    --primary-soft: #EAE3EE;
    --accent: #B4832E;
    --accent-soft: #F3E6C8;
    --accent-soft-2: #FAF1DC;
    --border: #E7DED2;
    --danger: #A6465B;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #201A26;
      --surface: #2B2432;
      --ink: #F1EAF2;
      --ink-soft: #B4A6BD;
      --primary: #C9B7DC;
      --primary-soft: #3C3245;
      --accent: #D9AE5C;
      --accent-soft: #493B26;
      --accent-soft-2: #392F1E;
      --border: #3D3446;
    }
  }
  :root[data-theme="dark"] {
    --bg: #201A26;
    --surface: #2B2432;
    --ink: #F1EAF2;
    --ink-soft: #B4A6BD;
    --primary: #C9B7DC;
    --primary-soft: #3C3245;
    --accent: #D9AE5C;
    --accent-soft: #493B26;
    --accent-soft-2: #392F1E;
    --border: #3D3446;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  h1, h2, h3, .display {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 0;
  }
  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
  }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 22px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand .display { font-size: 23px; }
  .brand span { color: var(--ink-soft); font-size: 12.5px; letter-spacing: 0.01em; }

  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: var(--surface);
    padding: 10px 16px;
    border-radius: 5px;
    cursor: pointer;
    transition: opacity .15s ease, transform .1s ease;
  }
  .btn:hover { opacity: .88; }
  .btn:active { transform: translateY(1px); }
  .btn.secondary {
    background: transparent;
    color: var(--primary);
  }
  .btn.ghost {
    background: transparent;
    border-color: var(--border);
    color: var(--ink-soft);
  }
  .btn.danger {
    background: transparent;
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn.full { width: 100%; }
  .btn.small { padding: 6px 12px; font-size: 13px; }

  .client-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }
  .client-item {
    padding: 12px 14px;
    border-radius: 6px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .client-item:hover { background: var(--primary-soft); }
  .client-item.active {
    background: var(--primary-soft);
    border-left: 3px solid var(--accent);
  }
  .client-item .name {
    font-family: 'Fraunces', serif;
    font-size: 16.5px;
  }
  .client-item .meta {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .empty-side {
    color: var(--ink-soft);
    font-size: 13.5px;
    padding: 10px;
  }

  /* Main */
  .main {
    padding: 36px 44px 60px;
    max-width: 900px;
  }
  @media (max-width: 640px) {
    .main { padding: 24px 18px 48px; }
  }
  .main-empty {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    padding-top: 80px;
    max-width: 420px;
  }
  .main-empty .display { font-size: 26px; }
  .main-empty p { color: var(--ink-soft); margin: 0; }

  .profile-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .profile-head .display { font-size: 30px; }
  .profile-head .sub { color: var(--ink-soft); font-size: 14px; margin-top: 4px; }
  .head-actions { display: flex; gap: 8px; }

  .section {
    border-top: 1px solid var(--border);
    padding-top: 22px;
    margin-top: 26px;
  }
  .section h2 {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    font-family: 'IBM Plex Sans', sans-serif;
    text-transform: none;
    margin-bottom: 16px;
  }

  form.client-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 18px;
  }
  form.client-form .full-row { grid-column: 1 / -1; }
  @media (max-width: 560px) {
    form.client-form { grid-template-columns: 1fr; }
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  input, select, textarea {
    font-family: inherit;
    font-size: 14.5px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }
  textarea { resize: vertical; min-height: 60px; }

  .stat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }
  .stat {
    flex: 1 1 180px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 3px;
    padding: 14px 18px;
    background: var(--surface);
  }
  .stat .label { font-size: 12.5px; color: var(--ink-soft); }
  .stat .value { font-family: 'Fraunces', serif; font-size: 21px; margin-top: 5px; }
  .stat.highlight { border-left-color: var(--accent); background: var(--accent-soft-2); }
  .stat.highlight .value { color: var(--accent); }

  .disclaimer {
    font-size: 12.5px;
    color: var(--ink-soft);
    border-left: 2px solid var(--border);
    padding-left: 10px;
    margin-top: 18px;
  }

  /* Calendar */
  .months {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 22px;
  }
  .month {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    background: var(--surface);
  }
  .month h3 {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    margin-bottom: 12px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    font-size: 11.5px;
  }
  .cal-grid .dow {
    text-align: center;
    color: var(--ink-soft);
    font-size: 10.5px;
    padding-bottom: 4px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    color: var(--ink-soft);
    position: relative;
  }
  .cal-day.blank { visibility: hidden; }
  .cal-day.period { background: var(--accent); color: #fff; font-weight: 500; }
  .cal-day.fertile { background: var(--accent-soft); color: var(--ink); }
  .cal-day.ovulation {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent);
  }
  .cal-day.today { text-decoration: underline; text-underline-offset: 2px; }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 14px;
  }
  .legend .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: -1px;
  }
  .dot.period { background: var(--accent); }
  .dot.fertile { background: var(--accent-soft); border: 1px solid var(--accent); }
  .dot.ovulation { background: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--accent); }

  .upcoming-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .upcoming-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 13.5px;
    flex-wrap: wrap;
  }
  .upcoming-item .cycle-n { color: var(--ink-soft); min-width: 70px; }

  dialog {
    border: none;
    border-radius: 6px;
    padding: 0;
    max-width: 380px;
    width: 90%;
  }
  dialog::backdrop { background: rgba(20,20,15,0.4); }
  .dialog-body { padding: 24px; }
  .dialog-body p { color: var(--ink-soft); font-size: 14px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="display">Ciclos</div>
      <span>Calendario de fertilidad por clienta</span>
    </div>
    <button class="btn full" id="btnNueva">+ Nueva clienta</button>
    <ul class="client-list" id="listaClientes"></ul>
  </aside>

  <main class="main" id="main"></main>
</div>

<dialog id="dlgConfirm">
  <div class="dialog-body">
    <h3 class="display" style="font-size:18px;">Eliminar clienta</h3>
    <p>Esta acción no se puede deshacer. Se perderán todos los datos guardados de esta clienta en este dispositivo.</p>
    <div class="dialog-actions">
      <button class="btn ghost" id="btnCancelDel">Cancelar</button>
      <button class="btn danger" id="btnConfirmDel">Eliminar</button>
    </div>
  </div>
</dialog>

<script>
(function () {
  const STORAGE_KEY = 'ciclos_clientas_v1';
  const DOW = ['L','M','X','J','V','S','D'];
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  let state = { clientes: [], activeId: null };

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch (e) { console.error('No se pudo leer almacenamiento local', e); }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { console.error('No se pudo guardar', e); }
  }

  function uid() { return 'c_' + Math.random().toString(36).slice(2, 10); }

  function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }
  function fmtDate(d) {
    return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function isoDay(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // --- Cálculo de ciclos ---
  function calcularCiclos(cliente, nCiclos) {
    const fum = new Date(cliente.fum + 'T00:00:00');
    const duracion = Number(cliente.duracionCiclo) || 28;
    const lutea = Number(cliente.faseLutea) || 14;
    const hoy = new Date(); hoy.setHours(0,0,0,0);

    const diffDias = Math.floor((hoy - fum) / 86400000);
    let cicloActual = Math.floor(diffDias / duracion);
    if (cicloActual < 0) cicloActual = 0;

    const ciclos = [];
    for (let i = 0; i < nCiclos; i++) {
      const n = cicloActual + i;
      const inicioPeriodo = addDays(fum, duracion * n);
      const ovulacion = addDays(inicioPeriodo, duracion - lutea);
      const fertilInicio = addDays(ovulacion, -5);
      const fertilFin = addDays(ovulacion, 1);
      const proximoPeriodo = addDays(inicioPeriodo, duracion);
      ciclos.push({ n: n+1, inicioPeriodo, ovulacion, fertilInicio, fertilFin, proximoPeriodo });
    }
    return ciclos;
  }

  function clasificarDia(iso, ciclos) {
    for (const c of ciclos) {
      const period = new Set();
      for (let i=0;i<5;i++) period.add(isoDay(addDays(c.inicioPeriodo, i))); // ~5 días de sangrado estimados
      if (isoDay(c.ovulacion) === iso) return 'ovulation';
      const fi = c.fertilInicio, ff = c.fertilFin;
      const d = new Date(iso + 'T00:00:00');
      if (d >= fi && d <= ff) return 'fertile';
      if (period.has(iso)) return 'period';
    }
    return null;
  }

  // --- Render sidebar ---
  function renderSidebar() {
    const ul = document.getElementById('listaClientes');
    ul.innerHTML = '';
    if (state.clientes.length === 0) {
      ul.innerHTML = '<div class="empty-side">Todavía no agregaste clientas. Usa "+ Nueva clienta" para empezar.</div>';
      return;
    }
    state.clientes.forEach(c => {
      const li = document.createElement('li');
      li.className = 'client-item' + (c.id === state.activeId ? ' active' : '');
      let metaTxt = 'Sin FUM registrada';
      if (c.fum) {
        const ciclos = calcularCiclos(c, 1);
        metaTxt = 'Ovulación est. ' + ciclos[0].ovulacion.toLocaleDateString('es-ES', {day:'numeric', month:'short'});
      }
      li.innerHTML = `<div class="name">${escapeHtml(c.nombre || 'Sin nombre')}</div><div class="meta">${metaTxt}</div>`;
      li.addEventListener('click', () => { state.activeId = c.id; save(); render(); });
      ul.appendChild(li);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // --- Render main ---
  function render() {
    renderSidebar();
    const main = document.getElementById('main');
    const cliente = state.clientes.find(c => c.id === state.activeId);

    if (!cliente) {
      main.innerHTML = `
        <div class="main-empty">
          <div class="display">Seguimiento de ciclo, por clienta</div>
          <p>Selecciona una clienta de la lista o crea una nueva para registrar su fecha de última menstruación y ver su calendario de ovulación estimado.</p>
        </div>`;
      return;
    }

    const tieneFum = !!cliente.fum;
    const ciclos = tieneFum ? calcularCiclos(cliente, 3) : [];

    main.innerHTML = `
      <div class="profile-head">
        <div>
          <div class="display">${escapeHtml(cliente.nombre || 'Sin nombre')}</div>
          <div class="sub">${escapeHtml(cliente.contacto || 'Sin datos de contacto')}${cliente.edad ? ' · ' + cliente.edad + ' años' : ''}</div>
        </div>
        <div class="head-actions">
          <button class="btn ghost small" id="btnEliminar">Eliminar</button>
        </div>
      </div>

      <div class="section">
        <h2>Datos del ciclo</h2>
        <form class="client-form" id="formCliente">
          <label>Nombre
            <input type="text" name="nombre" value="${escapeHtml(cliente.nombre||'')}" required>
          </label>
          <label>Contacto (teléfono o email)
            <input type="text" name="contacto" value="${escapeHtml(cliente.contacto||'')}">
          </label>
          <label>Edad
            <input type="number" name="edad" min="10" max="60" value="${cliente.edad||''}">
          </label>
          <label>Regularidad del ciclo
            <select name="regularidad">
              <option value="regular" ${cliente.regularidad==='regular'?'selected':''}>Regular</option>
              <option value="irregular" ${cliente.regularidad==='irregular'?'selected':''}>Irregular</option>
            </select>
          </label>
          <label>Fecha de última menstruación (FUM)
            <input type="date" name="fum" value="${cliente.fum||''}" required>
          </label>
          <label>Duración promedio del ciclo (días)
            <input type="number" name="duracionCiclo" min="18" max="45" value="${cliente.duracionCiclo||28}" required>
          </label>
          <label>Duración de la fase lútea (días)
            <input type="number" name="faseLutea" min="9" max="17" value="${cliente.faseLutea||14}" required>
          </label>
          <label class="full-row">Notas clínicas
            <textarea name="notas" placeholder="Antecedentes, tratamientos, objetivos...">${escapeHtml(cliente.notas||'')}</textarea>
          </label>
          <div class="full-row">
            <button class="btn" type="submit">Guardar cambios</button>
          </div>
        </form>
      </div>

      ${tieneFum ? renderResultados(ciclos, cliente) : `
        <div class="section">
          <h2>Estimación</h2>
          <p style="color:var(--ink-soft); font-size:14px;">Completa la fecha de última menstruación y la duración del ciclo para calcular la ovulación estimada.</p>
        </div>`}

      <div class="disclaimer">
        Estimación calculada a partir de la duración de ciclo declarada; asume regularidad. En ciclos irregulares o con datos limitados, el margen de error de la fecha exacta de ovulación puede ser de varios días. No reemplaza métodos de confirmación (LH, temperatura basal, ecografía) ni criterio clínico.
      </div>
    `;

    document.getElementById('formCliente').addEventListener('submit', onGuardar);
    document.getElementById('btnEliminar').addEventListener('click', onPedirEliminar);
  }

  function renderResultados(ciclos, cliente) {
    const c0 = ciclos[0];
    const statsHtml = `
      <div class="section">
        <h2>Ciclo actual</h2>
        <div class="stat-row">
          <div class="stat">
            <div class="label">Inicio de período</div>
            <div class="value">${fmtDate(c0.inicioPeriodo)}</div>
          </div>
          <div class="stat highlight">
            <div class="label">Ovulación estimada</div>
            <div class="value">${fmtDate(c0.ovulacion)}</div>
          </div>
          <div class="stat">
            <div class="label">Ventana fértil</div>
            <div class="value">${c0.fertilInicio.toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${c0.fertilFin.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</div>
          </div>
          <div class="stat">
            <div class="label">Próxima menstruación</div>
            <div class="value">${fmtDate(c0.proximoPeriodo)}</div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>Próximos 3 ciclos</h2>
        <div class="upcoming-list">
          ${ciclos.map(c => `
            <div class="upcoming-item">
              <span class="cycle-n">Ciclo ${c.n}</span>
              <span>Período: ${c.inicioPeriodo.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</span>
              <span>Fértil: ${c.fertilInicio.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}–${c.fertilFin.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</span>
              <span><strong>Ovulación: ${c.ovulacion.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</strong></span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="section">
        <h2>Calendario</h2>
        <div class="months" id="months"></div>
        <div class="legend">
          <span><span class="dot period"></span>Menstruación</span>
          <span><span class="dot fertile"></span>Ventana fértil</span>
          <span><span class="dot ovulation"></span>Ovulación estimada</span>
        </div>
      </div>
    `;
    // months rendered after insertion (needs DOM), schedule via setTimeout 0
    setTimeout(() => renderMonths(ciclos), 0);
    return statsHtml;
  }

  function renderMonths(ciclos) {
    const container = document.getElementById('months');
    if (!container) return;
    const hoy = new Date();
    const monthsToShow = 3;
    let html = '';
    for (let m = 0; m < monthsToShow; m++) {
      const base = new Date(hoy.getFullYear(), hoy.getMonth() + m, 1);
      html += renderMonthGrid(base, ciclos, hoy);
    }
    container.innerHTML = html;
  }

  function renderMonthGrid(base, ciclos, hoy) {
    const year = base.getFullYear(), month = base.getMonth();
    const firstDay = new Date(year, month, 1);
    const startOffset = (firstDay.getDay() + 6) % 7; // lunes=0
    const daysInMonth = new Date(year, month+1, 0).getDate();

    let cells = '';
    for (let i=0;i<startOffset;i++) cells += '<div class="cal-day blank"></div>';
    for (let d=1; d<=daysInMonth; d++) {
      const dateObj = new Date(year, month, d);
      const iso = isoDay(dateObj);
      const cls = clasificarDia(iso, ciclos);
      const isToday = isoDay(hoy) === iso;
      cells += `<div class="cal-day ${cls||''} ${isToday?'today':''}">${d}</div>`;
    }
    return `
      <div class="month">
        <h3>${MESES[month]} ${year}</h3>
        <div class="cal-grid">
          ${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}
          ${cells}
        </div>
      </div>
    `;
  }

  // --- Acciones ---
  function onGuardar(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const cliente = state.clientes.find(c => c.id === state.activeId);
    if (!cliente) return;
    cliente.nombre = fd.get('nombre').trim();
    cliente.contacto = fd.get('contacto').trim();
    cliente.edad = fd.get('edad');
    cliente.regularidad = fd.get('regularidad');
    cliente.fum = fd.get('fum');
    cliente.duracionCiclo = fd.get('duracionCiclo');
    cliente.faseLutea = fd.get('faseLutea');
    cliente.notas = fd.get('notas');
    save();
    render();
  }

  let pendingDeleteId = null;
  function onPedirEliminar() {
    pendingDeleteId = state.activeId;
    document.getElementById('dlgConfirm').showModal();
  }

  document.getElementById('btnCancelDel').addEventListener('click', () => {
    document.getElementById('dlgConfirm').close();
    pendingDeleteId = null;
  });
  document.getElementById('btnConfirmDel').addEventListener('click', () => {
    state.clientes = state.clientes.filter(c => c.id !== pendingDeleteId);
    state.activeId = state.clientes[0] ? state.clientes[0].id : null;
    save();
    document.getElementById('dlgConfirm').close();
    render();
  });

  document.getElementById('btnNueva').addEventListener('click', () => {
    const nueva = {
      id: uid(),
      nombre: '',
      contacto: '',
      edad: '',
      regularidad: 'regular',
      fum: '',
      duracionCiclo: 28,
      faseLutea: 14,
      notas: ''
    };
    state.clientes.unshift(nueva);
    state.activeId = nueva.id;
    save();
    render();
    setTimeout(() => {
      const input = document.querySelector('input[name="nombre"]');
      if (input) input.focus();
    }, 0);
  });

  load();
  if (!state.activeId && state.clientes[0]) state.activeId = state.clientes[0].id;
  render();
})();
</script>
</body>
</html>
